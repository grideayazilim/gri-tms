# ============================================================================
# docker-compose.test.yml — TEST ORTAMI (tam stack)
#
# Kullanım:
#   cp apps/management/server/.env.test.example apps/management/server/.env.test   # ilk kez
#   # apps/management/server/.env.test içindeki değerleri düzenle
#   docker compose -f docker-compose.test.yml up -d --build
#   docker compose -f docker-compose.test.yml logs -f       # logları izle
#   docker compose -f docker-compose.test.yml down -v       # sıfırla
# ============================================================================

name: gritms-test

services:
  postgres:
    image: postgres:17-alpine
    container_name: gritms-test-postgres
    restart: unless-stopped
    env_file:
      - ./apps/management/server/.env.test
    ports:
      - "5434:5432"
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/management/server/Dockerfile
      args:
        - SKIP_PRUNE=true
    image: gritms/server:test
    container_name: gritms-test-server
    restart: unless-stopped
    env_file:
      - ./apps/management/server/.env.test
    environment:
      - TZ=Europe/Istanbul
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  client:
    build:
      context: .
      dockerfile: apps/management/client/Dockerfile
    image: gritms/client:test
    container_name: gritms-test-client
    restart: unless-stopped
    ports:
      - "80:8080"     # yalnızca HTTPS'e yönlendirme
      - "443:8443"    # nginx TLS ile çalışır
    volumes:
      # Test ortamı için self-signed sertifika üretin:
      #   mkdir -p docker/nginx/certs && openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
      #     -keyout docker/nginx/certs/privkey.pem -out docker/nginx/certs/fullchain.pem -subj "/CN=localhost"
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/certbot-www:/var/www/certbot:ro
    depends_on:
      - server
    networks:
      - net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  bot-server:
    build:
      context: ./apps/bot/server
      dockerfile: Dockerfile
    image: gritms/bot-server:test
    container_name: gritms-test-bot-server
    restart: unless-stopped
    # Bot, yönetim uygulamasıyla aynı ACCESS_TOKEN_SECRET ile doğrulama yapar
    env_file:
      - ./apps/management/server/.env.test
    shm_size: 512m
    networks:
      - net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  bot-client:
    build:
      context: ./apps/bot/client
      dockerfile: Dockerfile
    image: gritms/bot-client:test
    container_name: gritms-test-bot-client
    restart: unless-stopped
    networks:
      - net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  pgdata:

networks:
  net:
    driver: bridge
