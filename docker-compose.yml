# ============================================================================
# docker-compose.yml — GELİŞTİRME (sadece veritabanı)
#
# Kullanım:
#   docker compose up -d
#
# Server ve client local'de çalışır (npm run dev).
# Bu compose yalnızca PostgreSQL'i Docker'da ayağa kaldırır.
#
# Gerekli: server/.env dosyasının POSTGRES_* değişkenlerini içermesi lazım.
# (server/.env.example'a bakın)
# ============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: timesheet_postgres_dev
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
