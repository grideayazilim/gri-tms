# ============================================================================
# docker-compose.yml — LOCAL DEV ORTAMI (Sadece PostgreSQL)
#
# Sunucuda kullanmayın; production için docker-compose.prod.yml. Buradaki
# `ports: 5432:5432` veritabanını host'a açar.
#
# Kullanım:
#   docker compose up -d          # DB'yi başlat
#   docker compose down           # DB'yi durdur
#   docker compose down -v        # DB'yi SİL (tüm veriyi temizle, sıfırdan başla)
#   docker compose logs -f db     # DB loglarını izle
# ============================================================================

name: gritms-dev

services:
  db:
    image: postgres:17-alpine
    container_name: gritms-dev-db
    restart: unless-stopped
    env_file:
      - ./apps/management/server/.env
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports:
      # Yalnızca localhost'a bağla — makine dışından erişilemez
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
