upstream api {
    server server:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # React build dosyaları
    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # API proxy — /api/* → Express server:3000
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dosya upload / export için timeout artır
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Buffer'ları kapat — stream response'lar için (Excel export)
        proxy_buffering off;
    }

    # React Router: dosya bulunamazsa index.html'e düş
    location / {
        try_files $uri $uri/ /index.html;

        # Statik varlıklar için uzun cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
