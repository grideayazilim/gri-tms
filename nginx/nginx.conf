# ============================================================================
# gri-TMS — nginx yapılandırması
#
# İç ağ ve dışa açık kurulum için aynı dosya; fark yalnızca sertifikanın
# nereden geldiğidir. Sertifika hazır değilse geçici olarak HTTP'ye dönmek için
# 8443 ssl bloğunu 8080 yapın, ssl_*/HSTS satırlarını ve HTTP yönlendirmesini
# kaldırın, .env.prod'da COOKIE_SECURE=false yapın.
# ============================================================================

# ─── Upstream çözümlemesi ────────────────────────────────────────────
# nginx, sabit proxy hedeflerini açılışta çözer; hedef container ayakta değilse
# hiç başlamaz ve tek bir servis tüm siteyi düşürür. Docker'ın DNS'ini resolver
# verip hedefleri değişkenle yazınca çözümleme istek anında yapılır.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ─── Rate limit bölgeleri ───────────────────────────────────────────────────
# limit_req_zone yalnızca http bloğunda geçerli. Bu dosya conf.d altına
# kopyalanıyorsa burada kalabilir, nginx.conf'un yerine geçiyorsa http'ye taşıyın.
limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=static_zone:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# SSE ve WebSocket için doğru Connection başlığı
# Bot SSE kullanıyor, WebSocket değil: Upgrade boşken "upgrade" göndermek yanlıştı.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ─── HTTP: yalnızca ACME doğrulaması + HTTPS'e yönlendirme ─────────────────
server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Let's Encrypt HTTP-01 doğrulaması (iç CA kullanılıyorsa gereksiz)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: asıl sunucu ────────────────────────────────────────────────────
server {
    # nginx-unprivileged imajı ayrıcalıklı port açamaz — docker-compose 443:8443 map eder
    listen 8443 ssl;
    http2 on;
    server_name _;

    # nginx, Location başlığına dinlediği portu (8443) ekliyor; o port dışarı
    # yayınlanmadığı için tarayıcı bağlanamıyordu. Kapalıyken Location göreli
    # kalır; HTTP→HTTPS yönlendirmesi ayrı blokta olduğu için etkilenmez.
    absolute_redirect off;

    # Nginx sürüm bilgisini gizle (ZAP: Server Version Leak)
    server_tokens off;

    # ── TLS ────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Güvenlik başlıkları ───────────────────────────────────────────────
    # HSTS: iç ağda düşük max-age ile başlayın (sertifika sorununda erişim
    # kilitlenmesin), işler oturunca 31536000'e çıkarın.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # React build dosyaları
    root /usr/share/nginx/html;
    index index.html;

    # Excel yükleme/indirme için gövde sınırı
    client_max_body_size 20m;
    client_body_timeout  60s;

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Eşzamanlı bağlantı sınırı — bant genişliği amplifikasyonuna karşı
    limit_conn conn_zone 40;

    # ── Bot ve video için ortak doğrulama ucu ──────────────────
    # auth_request bu iç konumu çağırır; 2xx dönerse istek devam eder.
    location = /_auth_verify {
        internal;
        set $auth_upstream      http://server:3000;
        proxy_pass              $auth_upstream/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        Host $host;
        proxy_set_header        Cookie $http_cookie;
    }

    # Tek yönlendirme iki farklı durumu aynı yere gönderiyordu. Doğrulama
    # ucu (authController.verifySession) ikisini zaten ayırıyor: girişi olmayana
    # 401, giriş yapmış ama admin olmayana 403.

    # Giriş yok (401) → giriş ekranı, dönüş adresi korunur
    location @auth_redirect_login {
        return 302 /auth?next=$request_uri;
    }

    # Giriş var ama admin değil (403) → ana sayfa
    # (Giriş ekranına atmak anlamsızdı: kullanıcının zaten oturumu olduğu için
    # ekran onu tekrar ana sayfaya atıyor ve sebep hiç görünmüyordu.)
    location @auth_redirect_home {
        return 302 /;
    }

    # ── Uzun süren yönetim işlemleri ───────────────────────────────
    # Yedek üretimi 70-84 workbook demek, dakikalar sürebiliyor; /api/ için
    # yeterli olan 120 sn burada yetmiyor.
    location ~ ^/api/settings/(backup|reset)$ {
        set $api_upstream http://server:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ── API proxy — /api/* → Express server:3000 ─────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;

        set $api_upstream http://server:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dosya upload / export için timeout artır
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Buffer'ları kapat — stream response'lar için (Excel export)
        proxy_buffering off;
    }

    # ── Bot API proxy — /bot-api/* → Bot Express server:3001 ─────────────
    # Eskiden tamamen kimliksizdi. Artık admin oturumu şart.
    location /bot-api/ {
        auth_request /_auth_verify;
        error_page 401 = @auth_json_unauthorized;
        error_page 403 = @auth_json_forbidden;

        limit_req zone=api_zone burst=20 nodelay;

        # Değişkenli hedef + rewrite → bot çökse bile nginx ayakta kalır
        set $bot_api_upstream http://bot-server:3001;
        rewrite ^/bot-api/(.*)$ /$1 break;
        proxy_pass $bot_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # API çağrıları için HTML yönlendirme değil, JSON dön
    location @auth_json_unauthorized {
        default_type application/json;
        return 401 '{"success":false,"message":"Oturum bulunamadı. Lütfen giriş yapın."}';
    }

    location @auth_json_forbidden {
        default_type application/json;
        return 403 '{"success":false,"message":"Bu işlem için yönetici yetkisi gerekir."}';
    }

    # ── Bot arayüzü — /bot/* → Bot Client ──────────────────────────
    location /bot/ {
        auth_request /_auth_verify;
        error_page 401 = @auth_redirect_login;
        error_page 403 = @auth_redirect_home;

        set $bot_ui_upstream http://bot-client:8080;
        rewrite ^/bot/(.*)$ /$1 break;
        proxy_pass $bot_ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Video rehberler — giriş yapmış kullanıcılara açık ──────────
    location /video-guides/ {
        auth_request /_auth_verify;
        error_page 401 = @auth_redirect_login;
        error_page 403 = @auth_redirect_home;

        limit_req zone=static_zone burst=20 nodelay;

        # add_header kalıtımı — iç blokta tüm başlıklar tekrarlanmalı
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # mp4 cache regex'e dahil değildi — her istek tam indirme oluyordu
        add_header Cache-Control "private, max-age=2592000" always;
        expires 30d;
    }

    # ── React Router: dosya bulunamazsa index.html'e düş ────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Statik varlıklar için uzun cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            limit_req zone=static_zone burst=60 nodelay;
            expires 1y;

            # nginx'te bir seviyede add_header tanımlıysa üst seviyedekiler
            # o seviyeye HİÇ inmez. Bu blok yüzünden tüm JS/CSS/resim
            # yanıtlarında CSP, X-Frame-Options vb. kayboluyordu.
            add_header Cache-Control "public, immutable" always;
            add_header Strict-Transport-Security "max-age=300" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        }
    }
}
