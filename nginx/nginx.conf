upstream api {
    server server:3000;
    keepalive 32;
}

server {
    # nginx-unprivileged imajı 8080'de çalışır — docker-compose 80:8080 map eder
    listen 8080;
    server_name _;

    # Nginx versiyon bilgisini gizle (ZAP: Server Version Leak)
    # Nginx versiyon numarasını gizle — bilgi ifşası önlemi
    server_tokens off;

    # Güvenlik başlıkları — clickjacking, MIME sniff, CSP, CORP koruması
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';" always;

    # React build dosyaları
    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # API proxy — /api/* → Express server:3000
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dosya upload / export için timeout artır
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Buffer'ları kapat — stream response'lar için (Excel export)
        proxy_buffering off;
    }

    # Bot API proxy — /bot-api/* → Bot Express server:3001
    location /bot-api/ {
        # Assuming bot-server listens on port 3001
        proxy_pass http://bot-server:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Bot Frontend proxy — /bot/* → Bot Client server:80
    location /bot/ {
        proxy_pass http://bot-client:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: dosya bulunamazsa index.html'e düş
    location / {
        try_files $uri $uri/ /index.html;

        # Statik varlıklar için uzun cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
